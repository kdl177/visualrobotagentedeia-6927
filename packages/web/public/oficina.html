<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oficina SIMBAI</title>
<meta name="description" content="Oficina 3D de los agentes de IA de SIMBAI: recorre los despachos, acércate a cada agente robot y ve su actividad y coste, leídos de sus logs.">
<meta name="theme-color" content="#141A2E">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="icon-180.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",

<style>
:root{
  --night:#141A2E; --navy:#1E2A4A; --navy2:#2C3A61; --cream:#F6EBDA;
  --coral:#FF6B4A; --mint:#35E0AE; --sky:#6EC6FF; --amber:#FFC15E; --plum:#7A5CFF;
  --tx:#F6EBDA; --mut:rgba(246,235,218,.55); --line:rgba(246,235,218,.14); --card:rgba(20,26,46,.72);
  --display:"Baloo 2",system-ui,sans-serif; --body:"Poppins",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--night);color:var(--tx);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
#escena{position:fixed;inset:0}
#escena canvas{display:block;touch-action:none}
#etiquetas{position:fixed;inset:0;pointer-events:none;z-index:1} /* contexto propio: CSS2DRenderer pone z-index altos a cada etiqueta */
.vignette{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(10,14,26,.72) 100%)}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}

/* etiqueta flotante sobre cada robot */
.lbl{pointer-events:auto;cursor:pointer;white-space:nowrap;padding:8px 12px;border-radius:14px;transition:border-color .16s}
.lbl:hover,.lbl.on{border-color:rgba(246,235,218,.42)}
.lbl .nm{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.02em;line-height:1.1}
.lbl .row{display:flex;align-items:center;gap:7px;margin-top:5px}
.lbl .mod{font:500 10px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);background:rgba(246,235,218,.08);padding:3px 7px;border-radius:6px}
.lbl .dot{width:7px;height:7px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
.lbl .met{font:11px var(--mono);color:var(--mut);margin-top:6px}

/* placa sobre la puerta */
.placa{pointer-events:none;white-space:nowrap;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--cream);padding:6px 12px;border-radius:999px}
.placa span{color:var(--mut);font-weight:600}
.placa i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--plum);box-shadow:0 0 10px var(--plum);margin-left:8px;vertical-align:1px}
.placa.viva i{background:var(--mint);box-shadow:0 0 10px var(--mint)}
.placa.tuya i{background:var(--coral);box-shadow:0 0 10px var(--coral)}

.yo{pointer-events:none;font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--night);background:var(--coral);padding:4px 10px;border-radius:999px;box-shadow:0 8px 20px -8px var(--coral)}

header{position:fixed;top:calc(var(--safe-t) + 18px);left:24px;right:24px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;pointer-events:auto}
.brand a{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;color:var(--mut);text-decoration:none}
.brand a:hover{color:var(--cream)}
.brand a svg{width:16px;height:16px}
.brand__mark{width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 16px var(--coral)}
.brand__name{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.06em;line-height:1}
.brand__sub{margin-top:3px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.status{display:flex;align-items:center;gap:9px;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap}
.status i{width:9px;height:9px;border-radius:50%;background:var(--dot,var(--plum));box-shadow:0 0 12px var(--dot,var(--plum));animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.7}}
#aviso{position:fixed;top:calc(var(--safe-t) + 74px);left:50%;transform:translateX(-50%);z-index:5;font-size:12px;color:var(--amber);padding:7px 14px;border-radius:999px;pointer-events:none;white-space:nowrap}
#aviso:empty{display:none}

footer{position:fixed;left:24px;right:24px;bottom:calc(var(--safe-b) + 18px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
#zona{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:8px 14px;border-radius:999px;white-space:nowrap}
#zona b{color:var(--cream)}
.hint{display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--mut);letter-spacing:.02em;pointer-events:auto}
.hint span{transition:opacity .6s}
.hint.off span{opacity:0}
.hint button{background:none;border:1px solid rgba(246,235,218,.22);color:rgba(246,235,218,.75);border-radius:999px;padding:6px 13px;font:500 11.5px var(--body);cursor:pointer;white-space:nowrap;flex:none}
.hint button:hover{color:var(--night);background:var(--cream)}

aside{
  position:fixed; top:calc(var(--safe-t) + 84px); right:24px; width:min(330px,calc(100vw - 48px)); z-index:6;
  padding:18px; border-radius:22px; box-shadow:0 30px 60px -30px rgba(0,0,0,.8);
  max-height:calc(100vh - var(--safe-t) - 110px); overflow-y:auto;
  transform:translateX(24px); opacity:0; pointer-events:none; transition:.28s cubic-bezier(.22,1,.36,1);
}
aside.on{transform:none;opacity:1;pointer-events:auto}
aside .top{display:flex;align-items:center;gap:10px}
aside .nm{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.02em;line-height:1}
aside .mod{font:500 10px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);background:rgba(246,235,218,.08);padding:3px 8px;border-radius:6px}
aside .cerrar{margin-left:auto;background:none;border:0;color:var(--mut);cursor:pointer;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
aside .cerrar:hover{background:rgba(246,235,218,.1);color:var(--cream)}
aside .cerrar svg{width:14px;height:14px}
aside .estado{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);margin:12px 0 14px}
aside .estado i{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
aside .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
aside .v{font-family:var(--display);font-weight:700;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
aside .k{font-size:10px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
aside .pie{font:11px/1.7 var(--mono);color:var(--mut);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

.msg{position:fixed;inset:0;z-index:4;display:grid;place-items:center;text-align:center;color:var(--mut);font-size:13.5px;padding:20px;background:var(--night)}
.msg b{display:block;font-family:var(--display);color:var(--cream);font-size:18px;margin-bottom:6px}

/* chat con el agente, dentro de su ficha */
.chat{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.chat .hilo{display:flex;flex-direction:column;gap:8px;max-height:200px;overflow-y:auto;padding-right:2px}
.chat .hilo:empty{display:none}
.chat .m{max-width:88%;padding:9px 12px;border-radius:14px;font-size:12.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.chat .m.mio{align-self:flex-end;background:var(--coral);color:var(--night);border-bottom-right-radius:5px}
.chat .m.el{align-self:flex-start;background:rgba(246,235,218,.1);border-bottom-left-radius:5px}
.chat .m.err{align-self:stretch;background:rgba(255,107,74,.16);border:1px solid rgba(255,107,74,.4);font-size:12px}
.chat .meta{align-self:flex-start;font:10.5px var(--mono);color:var(--mut);margin-top:-4px}
.chat .dots::after{content:'…';display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.chat .motores{display:flex;gap:6px;margin-top:10px}
.chat .motores button{flex:1;background:none;border:1px solid rgba(246,235,218,.18);color:var(--mut);border-radius:999px;padding:6px 10px;font:500 11px var(--body);cursor:pointer;white-space:nowrap}
.chat .motores button.on{background:var(--cream);color:var(--night);border-color:var(--cream)}
.chat form{display:flex;gap:8px;margin-top:8px;align-items:flex-end}
.chat textarea{flex:1;resize:none;background:rgba(246,235,218,.08);border:1px solid var(--line);border-radius:14px;color:var(--cream);font:400 13px/1.4 var(--body);padding:9px 12px;outline:none;min-height:38px;max-height:96px}
.chat textarea:focus{border-color:rgba(246,235,218,.4)}
.chat textarea::placeholder{color:var(--mut)}
.chat form button{width:38px;height:38px;border-radius:50%;border:0;background:var(--coral);color:var(--night);cursor:pointer;flex:none;display:grid;place-items:center}
.chat form button svg{width:16px;height:16px}
.chat form button:disabled,.chat textarea:disabled{opacity:.5;cursor:default}
.chat .nota{font-size:10.5px;color:var(--mut);margin-top:8px;line-height:1.5}
.bocadillo{pointer-events:none;max-width:230px;padding:9px 12px;border-radius:14px;border-bottom-left-radius:4px;background:var(--cream);color:var(--night);font:400 12.5px/1.4 var(--body);white-space:normal;box-shadow:0 12px 30px -12px rgba(0,0,0,.6)}

@media(max-width:768px){
  header{left:16px;right:16px}
  .brand__sub{display:none}
  footer{left:16px;right:16px;flex-wrap:wrap}
  aside{top:auto;right:16px;left:16px;bottom:calc(var(--safe-b) + 66px);width:auto;max-height:70vh;transform:translateY(24px)}
  aside.on{transform:none}
}
@media(max-width:480px){.lbl{white-space:normal;max-width:140px}.lbl .met{display:none}.status{display:none}.brand__name{font-size:17px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="escena"></div>
<div id="etiquetas"></div>
<div class="vignette"></div>

<header>
  <div class="brand">
    <a class="card" href="/" aria-label="Volver a SIMBAI OS"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
    <span class="brand__mark"></span>
    <div><div class="brand__name">OFICINA SIMBAI</div><div class="brand__sub">tus agentes de IA, trabajando</div></div>
  </div>
  <div class="status card" id="estado"><i></i><span>cargando…</span></div>
</header>
<div id="aviso" class="card"></div>

<aside id="panel" class="card"></aside>

<footer>
  <div id="zona" class="card">Pasillo</div>
  <div class="hint" id="ayuda"><span></span><button type="button" id="vista">Vista general</button></div>
</footer>
<div class="msg" id="msg"><b>Abriendo la oficina…</b>Cargando la escena 3D</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const titulo = n => n.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
const tactil = matchMedia('(pointer: coarse)').matches;
const eur = n => new Intl.NumberFormat('es-ES', { maximumFractionDigits:0 }).format(n || 0) + ' €';

// paleta cartoon (la misma que el prototipo de Runable en packages/web/src/web/lib/palette.ts)
const PAL = {
  night:0x141A2E, navy:0x1E2A4A, navy2:0x2C3A61, cream:0xF6EBDA, cream2:0xE4D2BA,
  coral:0xFF6B4A, mint:0x35E0AE, sky:0x6EC6FF, amber:0xFFC15E, plum:0x7A5CFF,
  wood:0xC98A54, wood2:0x9C6437, leaf:0x3FAE72, leaf2:0x58C98A, white:0xFFFFFF,
};
const ESTADO = { cool:PAL.mint, warm:PAL.amber, dim:PAL.plum };
const CSSCOL = { cool:'#35E0AE', warm:'#FFC15E', dim:'#7A5CFF' };

// medidas del edificio (unidades ~ metros)
const PASILLO = 5, FONDO = 8, ALTO = 2.2, GROSOR = 0.15, PUERTA = 1.9, SEP_MESA = 3.6;
const RADIO = 0.35, VEL = 3.4, ALCANCE = 2.6, ROBOT = 0.62;

// `ultima` llega como "YYYY-MM-DD HH:MM" en UTC (ts[:16] del ISO del log).
function actividad(a){
  if (!a.ultima) return { clave:'dim', texto:'sin actividad registrada', fecha:null };
  const fecha = new Date(a.ultima.replace(' ', 'T') + ':00Z');
  const h = (Date.now() - fecha) / 36e5;
  const texto = h < 1 ? 'activo hace menos de una hora'
    : h < 24 ? `activo hace ${Math.round(h)} h`
    : `última actividad hace ${Math.round(h / 24)} días`;
  return { clave: h < 24 ? 'cool' : h < 24 * 7 ? 'warm' : 'dim', texto, fecha };
}

// colisión: el personaje es un círculo de RADIO contra cajas alineadas a los ejes
function libre(x, z, lista = obstaculos){
  return !lista.some(o => x + RADIO > o.x0 && x - RADIO < o.x1 && z + RADIO > o.z0 && z - RADIO < o.z1);
}

if (location.search === '?test'){
  const hace = n => ({ ultima: new Date(Date.now() - n * 36e5).toISOString().slice(0, 16).replace('T', ' ') });
  console.assert(actividad(hace(2)).clave === 'cool', 'cool');
  console.assert(actividad(hace(50)).clave === 'warm', 'warm');
  console.assert(actividad(hace(24 * 9)).clave === 'dim', 'dim');
  console.assert(actividad({}).clave === 'dim', 'sin log');
  const caja = [{ x0:-1, x1:1, z0:-1, z1:1 }];
  console.assert(!libre(0, 0, caja) && !libre(1.2, 0, caja) && libre(1.5, 0, caja) && libre(0, -1.4, caja), 'colision');
  console.log('ok actividad y colision');
}

/* ── escena ─────────────────────────────────────────── */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
} catch {
  $('#msg').innerHTML = '<b>Este navegador no puede abrir la oficina</b>Necesita WebGL.';
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.night);
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 160);

/* ── materiales y piezas ────────────────────────────── */
const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness:.8, metalness:.05, ...extra });
const plano = (color, extra = {}) => new THREE.MeshBasicMaterial({ color, toneMapped:false, ...extra });
const M = {
  cream: mat(PAL.cream, { roughness:.6 }), pared: mat(PAL.cream, { roughness:.95 }), navy: mat(PAL.navy, { roughness:.5, metalness:.2 }),
  navy2: mat(PAL.navy2, { roughness:1 }), coral: mat(PAL.coral, { roughness:.7 }), white: mat(PAL.white, { roughness:.6 }),
  wood: mat(PAL.wood, { roughness:.85 }), wood2: mat(PAL.wood2, { roughness:.9 }), night: mat(PAL.night, { roughness:.25, metalness:.3 }),
  leaf: mat(PAL.leaf, { roughness:.85, flatShading:true }), leaf2: mat(PAL.leaf2, { roughness:.85, flatShading:true }),
  papel: mat(PAL.white, { roughness:.95 }), plum: mat(PAL.plum, { roughness:.8 }), mint: mat(PAL.mint, { roughness:.8 }),
  amber: mat(PAL.amber, { roughness:.8 }), sky: mat(PAL.sky, { roughness:.8 }),
};
function caja(w, h, d, material, x, y, z, r = 0.03){
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, Math.min(r, w / 2, h / 2, d / 2)), material);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  return m;
}
function cil(rt, rb, h, material, x, y, z, seg = 14){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), material);
  m.position.set(x, y, z); m.castShadow = true;
  return m;
}
function bola(r, material, x, y, z, seg = 16){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, seg, Math.max(8, Math.round(seg * .75))), material);
  m.position.set(x, y, z); m.castShadow = true;
  return m;
}
function lamina(w, h, material, x, y, z){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), material);
  m.position.set(x, y, z);
  return m;
}
// caja alineada a los ejes en coordenadas de mundo a partir de un rectángulo local del objeto
function aabb(obj, x0, x1, z0, z1){
  const a = obj.localToWorld(new THREE.Vector3(x0, 0, z0)), b = obj.localToWorld(new THREE.Vector3(x1, 0, z1));
  return { x0:Math.min(a.x, b.x), x1:Math.max(a.x, b.x), z0:Math.min(a.z, b.z), z1:Math.max(a.z, b.z) };
}

const papelGeo = new THREE.BoxGeometry(0.3, 0.012, 0.4);
const mesas = [], porNombre = new Map(), despachos = [], paredes = [], obstaculos = [], bloques = [];
const graficos = [], leds = [], plantas = [], motas = [];
let mesaJefe = null, briefing = null, ultimoAgentes = null;

/* ── el robot (personaje de Runable, en nuestra escala) ── */
function robot(hex, escala = ROBOT){
  const color = new THREE.Color(hex);
  const luminoso = k => { const m = new THREE.MeshStandardMaterial({ color, emissive:color, emissiveIntensity:k, toneMapped:false }); m.userData.base = k; return m; };
  const g = new THREE.Group();

  const cabeza = new THREE.Group(); cabeza.position.y = 0.72;
  cabeza.add(caja(1.02, 0.78, 0.8, M.cream, 0, 0, 0, 0.3));
  cabeza.add(caja(0.82, 0.42, 0.12, M.night, 0, 0.04, 0.4, 0.06));
  const ojoGeo = new THREE.CapsuleGeometry(0.055, 0.06, 4, 12);
  const ojoI = new THREE.Mesh(ojoGeo, luminoso(2.4)); ojoI.position.set(-0.17, 0.06, 0.47);
  const ojoD = ojoI.clone(); ojoD.position.x = 0.17;
  const boca = new THREE.Mesh(new THREE.CapsuleGeometry(0.04, 0.16, 4, 10), luminoso(1.4));
  boca.position.set(0, -0.16, 0.43); boca.rotation.z = Math.PI / 2; boca.scale.y = 0.45;
  cabeza.add(ojoI, ojoD, boca, bola(0.16, M.navy, -0.56, 0, 0), bola(0.16, M.navy, 0.56, 0, 0));
  cabeza.add(cil(0.025, 0.025, 0.28, M.navy, 0, 0.48, 0, 8));
  const antena = bola(0.08, luminoso(2.6), 0, 0.66, 0); cabeza.add(antena);

  const cuerpo = caja(0.82, 0.86, 0.66, M.white, 0, -0.02, 0, 0.28);
  const nucleo = bola(0.13, luminoso(2.8), 0, 0.02, 0.35, 20);
  const luz = new THREE.PointLight(color, 2.2, 2.4, 2); luz.position.set(0, 0.1, 0.5);
  const manoI = bola(0.15, M.navy, -0.78, -0.1, 0.05, 18), manoD = bola(0.15, M.navy, 0.78, -0.1, 0.05, 18);
  const base = new THREE.Mesh(new THREE.ConeGeometry(0.34, 0.34, 16), mat(PAL.navy, { roughness:.4, flatShading:true }));
  base.position.y = -0.56; base.castShadow = true;
  const anillo1 = new THREE.Mesh(new THREE.TorusGeometry(0.46, 0.028, 10, 40), luminoso(2)); anillo1.position.y = -0.78; anillo1.rotation.x = Math.PI / 2;
  const anillo2 = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.02, 10, 32), luminoso(1.4)); anillo2.position.y = -0.92; anillo2.rotation.x = Math.PI / 2;
  const halo = new THREE.Mesh(new THREE.CircleGeometry(0.62, 32), new THREE.MeshBasicMaterial({ color, transparent:true, opacity:.16, toneMapped:false }));
  halo.position.y = -1.18; halo.rotation.x = -Math.PI / 2;

  g.add(cabeza, cuerpo, nucleo, luz, manoI, manoD, base, anillo1, anillo2, halo);
  g.scale.setScalar(escala);
  g.position.y = 1.18 * escala;
  Object.assign(g.userData, {
    cabeza, ojos:[ojoI, ojoD], boca, manos:[manoI, manoD], anillos:[anillo1, anillo2], nucleo, luz, halo, color, factor:1,
    lum:[ojoI.material, boca.material, antena.material, nucleo.material, anillo1.material, anillo2.material],
    fase: Math.random() * 6.28,
  });
  return g;
}
function colorea(r, hex, factor = 1){
  const u = r.userData;
  u.color.setHex(hex); u.factor = factor;
  for (const m of u.lum){ m.color.copy(u.color); m.emissive.copy(u.color); m.emissiveIntensity = m.userData.base * factor; }
  u.halo.material.color.copy(u.color); u.halo.material.opacity = 0.16 * factor;
  u.luz.color.copy(u.color);
}
// opts: s (ritmo), amp (manos), mira (Vector3 en mundo hacia donde girar la cabeza)
function animaRobot(r, t, dt, opts){
  const u = r.userData, s = opts.s || 1, k = r.scale.x;
  r.position.y = 1.18 * k + Math.sin(t * 1.4 * s + u.fase) * 0.09 * k;
  r.rotation.z = Math.sin(t * 0.9 + u.fase) * 0.03;
  u.anillos[0].rotation.z += dt * 0.9 * s; u.anillos[1].rotation.z -= dt * 1.4 * s;
  const parpadeo = Math.sin(t * 1.3 + u.fase) > 0.985 ? 0.12 : 1;
  for (const o of u.ojos) o.scale.y += (parpadeo - o.scale.y) * 0.4;
  const amp = opts.amp ?? 0.07;
  u.manos[0].position.y = Math.sin(t * 2.6 * s + u.fase) * amp - 0.1;
  u.manos[1].position.y = Math.sin(t * 2.6 * s + u.fase + Math.PI / 2) * amp - 0.1;
  u.nucleo.scale.setScalar(1 + Math.sin(t * 3 * s) * 0.14);
  u.luz.intensity = (2.2 + Math.sin(t * 3 * s) * 0.7) * u.factor;
  u.boca.scale.y += ((opts.habla ? 0.5 + Math.abs(Math.sin(t * 12)) * 1.6 : 0.45) - u.boca.scale.y) * 0.3;
  u.cabeza.rotation.x += ((opts.piensa ? -0.14 : 0) - u.cabeza.rotation.x) * 0.08;
  let giro = 0;
  if (opts.mira){
    const p = r.worldToLocal(opts.mira.clone());
    if (Math.hypot(p.x, p.z) < 14) giro = THREE.MathUtils.clamp(Math.atan2(p.x, p.z), -0.55, 0.55);
  }
  u.cabeza.rotation.y += (giro - u.cabeza.rotation.y) * 0.08;
}

/* ── mesa de agente (local: el robot mira hacia +z, la puerta) ── */
function mesa(x, z){
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.userData.esMesa = true;

  g.add(caja(2.3, 0.1, 1.1, M.cream, 0, 0.76, 0, 0.05));
  for (const [px, pz] of [[-1.0, -0.42], [1.0, -0.42], [-1.0, 0.42], [1.0, 0.42]]) g.add(cil(0.05, 0.05, 0.72, M.navy, px, 0.36, pz, 10));
  const mon = monitor(1.4, 0.82, 0.1, 0.81, 0.3); g.add(mon);
  g.add(caja(0.75, 0.04, 0.26, M.white, 0, 0.83, -0.15, 0.02));
  g.add(bola(0.07, M.white, 0.62, 0.84, -0.15, 12));
  g.add(taza(-0.45, 0.895, -0.4));
  g.add(libros(-0.85, 0.845, 0.28));
  const lamp = lampara(0.95, -0.28); g.add(lamp);

  const asiento = silla(0, -0.95); g.add(asiento);
  const rob = robot(PAL.plum); rob.position.z = -0.95; rob.visible = false; g.add(rob);

  const papeles = new THREE.Group(); g.add(papeles);
  const carpeta = caja(0.28, 0.03, 0.36, M.coral, 0.6, 0.83, 0.28, 0.005); carpeta.visible = false; g.add(carpeta);

  const div = document.createElement('div');
  div.className = 'lbl card';
  div.onclick = e => { e.stopPropagation(); irA(g); };
  const etiqueta = new CSS2DObject(div);
  etiqueta.position.set(0, 2.15, -0.95);
  etiqueta.center.set(0.5, 1);
  etiqueta.visible = false; // CSS2DRenderer pisa element.style.display en cada frame: se oculta el objeto, no el div
  g.add(etiqueta);
  // bocadillo con la respuesta cuando el agente habla
  const bdiv = document.createElement('div'); bdiv.className = 'bocadillo';
  const bocadillo = new CSS2DObject(bdiv);
  bocadillo.position.set(0.55, 1.9, -0.95); bocadillo.center.set(0, 1); bocadillo.visible = false;
  g.add(bocadillo);

  Object.assign(g.userData, { pantalla:mon.userData.pantalla, barras:mon.userData.barras, cabezal:lamp.userData.cabezal, silla:asiento, robot:rob, papeles, carpeta, div, etiqueta, bocadillo, datos:null, act:null, nombre:null, animo:null, animoHasta:0 });
  mesas.push(g);
  return g;
}

// `a` es el agente del endpoint o null; `nombre` viene de despachos.json aunque no haya datos
function aplica(g, a, nombre = a?.nombre){
  const u = g.userData;
  if (u.datos) porNombre.delete(u.datos.nombre);
  u.datos = a || null; u.nombre = nombre || null;
  u.act = a ? actividad(a) : null;
  u.papeles.clear();
  const ocupada = !!nombre;
  u.robot.visible = ocupada; u.silla.visible = !ocupada; u.etiqueta.visible = ocupada;
  u.barras.visible = !!a;
  u.pantalla.material.emissiveIntensity = a ? 1.1 : 0;
  u.cabezal.material.emissiveIntensity = a ? 0.9 : 0;
  u.carpeta.visible = !!a && (a.incompletas || 0) > 0;
  if (!ocupada) return;
  if (!a){
    colorea(u.robot, PAL.plum, 0.35);
    u.div.innerHTML = `<div class="nm">${esc(titulo(nombre))}</div><div class="row"><span class="mod">sin datos</span><span class="dot" style="background:${CSSCOL.dim};color:${CSSCOL.dim}"></span></div>`;
    return;
  }
  porNombre.set(a.nombre, g);
  if (!u.animo) colorea(u.robot, ESTADO[u.act.clave], u.act.clave === 'dim' ? 0.45 : 1); // si está pensando o hablando conserva ese color

  // una hoja por cada 6 conversaciones: se ve quién trabaja más sin leer números
  const n = Math.min(10, Math.ceil((a.conversaciones || 0) / 6));
  for (let k = 0; k < n; k++){
    const p = new THREE.Mesh(papelGeo, M.papel);
    p.position.set(-0.8 + Math.sin(k * 7.3) * 0.015, 0.816 + k * 0.013, -0.1 + Math.cos(k * 5.1) * 0.015);
    p.rotation.y = Math.sin(k * 3.7) * 0.12;
    p.castShadow = p.receiveShadow = true;
    u.papeles.add(p);
  }
  u.div.innerHTML = `
    <div class="nm">${esc(titulo(a.nombre))}</div>
    <div class="row"><span class="mod">${esc((a.modelo || 'sin uso').replace('claude-', ''))}</span><span class="dot" style="background:${CSSCOL[u.act.clave]};color:${CSSCOL[u.act.clave]}"></span></div>
    <div class="met">${a.conversaciones} conv · ${a.coste_medio} USD/conv</div>`;
}

/* ── despacho (local: puerta en +z) ─────────────────── */
function pared(g, w, d, x, z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, ALTO, d), M.pared);
  m.position.set(x, ALTO / 2, z);
  m.castShadow = m.receiveShadow = true;
  g.add(m);
  paredes.push({ m, w, d });
}
function rodapie(g, w, d, x, z){ const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.24, d), M.navy); m.position.set(x, 0.12, z); g.add(m); }

function despacho(cfg, W){
  const g = new THREE.Group();
  const D = FONDO, t = GROSOR;

  pared(g, W + t, t, 0, -D / 2);
  pared(g, t, D, -W / 2, 0);
  pared(g, t, D, W / 2, 0);
  const hoja = (W - PUERTA) / 2;
  pared(g, hoja, t, -(PUERTA + hoja) / 2, D / 2);
  pared(g, hoja, t, (PUERTA + hoja) / 2, D / 2);
  rodapie(g, W - t, 0.06, 0, -D / 2 + t / 2 + 0.03);
  rodapie(g, 0.06, D - t, -W / 2 + t / 2 + 0.03, 0);
  rodapie(g, 0.06, D - t, W / 2 - t / 2 - 0.03, 0);
  rodapie(g, hoja - t / 2, 0.06, -(PUERTA + hoja) / 2, D / 2 - t / 2 - 0.03);
  rodapie(g, hoja - t / 2, 0.06, (PUERTA + hoja) / 2, D / 2 - t / 2 - 0.03);

  ventana(g, 0, -D / 2 + t / 2 + 0.01);

  const alfombra = new THREE.Mesh(new THREE.CircleGeometry(Math.min(W, D) * 0.22, 40), M.navy2);
  alfombra.rotation.x = -Math.PI / 2; alfombra.position.set(0, 0.012, 0.6); alfombra.receiveShadow = true;
  const ribete = new THREE.Mesh(new THREE.RingGeometry(Math.min(W, D) * 0.17, Math.min(W, D) * 0.19, 40), M.coral);
  ribete.rotation.x = -Math.PI / 2; ribete.position.set(0, 0.016, 0.6);
  g.add(alfombra, ribete);

  const maceta = planta(W / 2 - 0.8, D / 2 - 0.9, 0.9); g.add(maceta);
  bloques.push([maceta, -0.35, 0.35, -0.35, 0.35]);

  const div = document.createElement('div');
  div.className = 'placa card';
  const placa = new CSS2DObject(div);
  placa.position.set(0, ALTO + 0.5, D / 2);
  placa.center.set(0.5, 1);
  g.add(placa);

  const propias = [];
  if (cfg.tuyo) interiorJefe(g, W, D);
  else {
    cuadro(g, -W / 2 + 1.7, 1.35, -D / 2 + t / 2 + 0.03, PAL.mint, 0.8, 0.6);
    cuadro(g, W / 2 - 1.7, 1.4, -D / 2 + t / 2 + 0.03, PAL.coral, 0.55, 0.55);
    for (const mx of [-W / 2 + 2.2, W / 2 - 2.2]){
      const m = new THREE.Mesh(new THREE.OctahedronGeometry(0.16, 0), new THREE.MeshStandardMaterial({ color:PAL.plum, emissive:PAL.plum, emissiveIntensity:1.6, transparent:true, opacity:.85, toneMapped:false }));
      m.position.set(mx, 1.4, 1.8); m.userData.fase = mx; g.add(m); motas.push(m);
    }
    const n = Math.max(cfg.mesas || 2, (cfg.agentes || []).length);
    for (let i = 0; i < n; i++){
      const m = mesa((i - (n - 1) / 2) * SEP_MESA, -1.5);
      g.add(m); propias.push(m);
    }
  }
  Object.assign(g.userData, { nombre:cfg.nombre, tuyo:!!cfg.tuyo, div, mesas:propias, W, D });
  despachos.push(g);
  return g;
}

// tu mesa de dirección: sillón, sillas de visita, rack de servidores, pizarra y estantería
function interiorJefe(g, W, D){
  const t = GROSOR;
  const m = new THREE.Group(); m.position.set(0, 0, -1.6); m.userData.jefe = true;
  m.add(caja(3.2, 0.12, 1.3, M.wood, 0, 0.76, 0, 0.05));
  for (const [x, z] of [[-1.45, -0.5], [1.45, -0.5], [-1.45, 0.5], [1.45, 0.5]]) m.add(cil(0.06, 0.06, 0.72, M.navy, x, 0.36, z, 10));
  const mon = monitor(1.7, 0.98, -0.3, 0.82, 0.3);
  mon.userData.pantalla.material.emissiveIntensity = 1.1; mon.userData.barras.visible = true;
  m.add(mon);
  m.add(caja(0.85, 0.04, 0.28, M.white, -0.3, 0.84, -0.15, 0.02));
  m.add(bola(0.07, M.white, 0.35, 0.85, -0.15, 12));
  m.add(taza(1.0, 0.905, 0.1));
  m.add(libros(-1.35, 0.855, -0.2));
  const lamp = lampara(1.25, -0.3); lamp.userData.cabezal.material.emissiveIntensity = 0.9; m.add(lamp);
  m.add(silla(0, -1.05, 0.8, 0.95));
  for (const x of [-0.9, 0.9]){ const s = silla(x, 1.3); s.rotation.y = Math.PI; m.add(s); }
  g.add(m);
  mesaJefe = m;

  const rack = rackServidores(); rack.position.set(-W / 2 + 0.95, 0, -D / 2 + 1.1); g.add(rack);

const edificio = new THREE.Group();

function construye(cfgs, jefeCfg){
  const cursor = [0, 0];
  cfgs.forEach((cfg, i) => {
    const n = Math.max(cfg.mesas || 2, (cfg.agentes || []).length);
    const W = Math.max(9, n * SEP_MESA + 2.4);
    const lado = i % 2; // 0 norte, 1 sur
    const d = despacho(cfg, W);
    d.position.set(cursor[lado] + W / 2, 0, (lado ? 1 : -1) * (PASILLO / 2 + FONDO / 2));
    if (lado) d.rotation.y = Math.PI; // la puerta mira al pasillo también en el lado sur
    cursor[lado] += W + GROSOR;
    edificio.add(d);
  });
  const largo = Math.max(...cursor, 12);

  const jefe = despacho(jefeCfg, 10);
  jefe.position.set(-FONDO / 2 - GROSOR, 0, 0); jefe.rotation.y = Math.PI / 2;
  edificio.add(jefe);

  edificio.position.x = -largo / 2;
  scene.updateMatrixWorld(true);

  for (const { m, w, d } of paredes) obstaculos.push(aabb(m, -w / 2, w / 2, -d / 2, d / 2));
  for (const m of mesas) obstaculos.push(aabb(m, -1.25, 1.25, -1.5, 0.65)); // mesa + silla o robot
  for (const [obj, ...r] of bloques) obstaculos.push(aabb(obj, ...r));
  for (const d of despachos) d.userData.zona = aabb(d, -d.userData.W / 2, d.userData.W / 2, -d.userData.D / 2, d.userData.D / 2);
  limites = { x0:-largo / 2 - FONDO - GROSOR - 1, x1:largo / 2 + 1, z0:-(PASILLO / 2 + FONDO + 1), z1:PASILLO / 2 + FONDO + 1 };

  // suelo de tarima
  const w = largo + 24, prof = FONDO * 2 + PASILLO + 18;
  const suelo = new THREE.Mesh(new THREE.PlaneGeometry(w, prof), M.wood);
  suelo.rotation.x = -Math.PI / 2; suelo.receiveShadow = true; suelo.userData.esSuelo = true;
  scene.add(suelo);
  for (let zz = -prof / 2; zz < prof / 2; zz += 1.6){
    const tabla = new THREE.Mesh(new THREE.PlaneGeometry(w, 0.06), M.wood2);
    tabla.rotation.x = -Math.PI / 2; tabla.position.set(0, 0.002, zz);
    scene.add(tabla);
  }
  scene.fog = new THREE.Fog(PAL.night, 26, 70);

  // luz: tarde cálida por las ventanas, relleno frío de pantalla
  scene.add(new THREE.HemisphereLight(PAL.sky, PAL.wood, 0.7));
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const sol = new THREE.DirectionalLight(PAL.amber, 2.1);
  sol.position.set(-7, 12, 8); sol.castShadow = true;
  sol.shadow.mapSize.set(2048, 2048);
  Object.assign(sol.shadow.camera, { left:-largo / 2 - FONDO - 4, right:largo / 2 + 4, top:prof / 2, bottom:-prof / 2, near:1, far:60 });
  sol.shadow.bias = -0.0005;
  scene.add(sol);
  const frio = new THREE.DirectionalLight(PAL.sky, 0.55); frio.position.set(6, 5, 8); scene.add(frio);
  return suelo;
}

// el token llega en la URL una vez (?tk=…) y queda en localStorage con la misma clave que la PWA, que comparte origen
const TK = (() => {
  const u = new URL(location.href), t = u.searchParams.get('tk');
  if (t){
    try { localStorage.setItem('simbai_tk', t); } catch {}
    u.searchParams.delete('tk'); history.replaceState(null, '', u);
    return t;
  }
  try { return localStorage.getItem('simbai_tk') || ''; } catch { return ''; }
})();
const charlas = new Map(); // agente → conversación viva mientras la oficina esté abierta
function charla(nombre){
  if (!charlas.has(nombre)) charlas.set(nombre, { sesion:'oficina-' + Date.now().toString(36), turnos:[], motor:'local', pensando:false });
  return charlas.get(nombre);
}
function pintaHilo(nombre){
  const c = charla(nombre), hilo = $('#hilo');
  if (!hilo) return;
  hilo.innerHTML = c.turnos.map(t => t.tipo === 'err'

  ).join('') + (c.pensando ? '<div class="m el"><span class="dots">Pensando</span></div>' : '');
  hilo.scrollTop = hilo.scrollHeight;
  $('#panel .motores')?.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.motor === c.motor));
  const ta = $('#texto'), bt = $('#envio button');
  if (ta){ ta.disabled = c.pensando; bt.disabled = c.pensando; }
  const nota = $('#nota');
  if (nota) nota.textContent = c.motor === 'local'
    ? 'Modelo local: gratis y no sale de tu PC, pero tarda alrededor de un minuto. Queda en el log del agente.'
    : 'Conversación real con Claude: unos 0,04 USD por mensaje. Queda en el log del agente.';
}
async function enviar(g){
  const a = g.userData.datos, c = charla(a.nombre), ta = $('#texto');
  const texto = ta?.value.trim();
  if (!texto || c.pensando) return;
  ta.value = '';
  c.turnos.push({ tipo:'mio', texto }); c.pensando = true;
  pintaHilo(a.nombre);
  animo(g, 'pensando');
  try {
    const r = await fetch('/api/hablar', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-Token':TK },
      body:JSON.stringify({ agente:a.nombre, mensaje:texto, sesion:c.sesion, motor:c.motor }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) c.turnos.push({ tipo:'err', texto:
      r.status === 401 ? 'Token no válido: abre SIMBAI OS con tu enlace en este navegador y vuelve.'
      : (r.status === 404 || r.status === 501) ? 'El chat vive en SIMBAI OS (puerto 8790), no en el servidor mínimo.'
      : d.error || `HTTP ${r.status}` });
    else { c.turnos.push({ tipo:'el', texto:d.texto, coste:d.coste, ms:d.ms, motor:d.motor }); di(g, d.texto || ''); }
  } catch {
    c.turnos.push({ tipo:'err', texto:'Sin conexión con el PC.' });
  }
  c.pensando = false;
  if (c.turnos.at(-1).tipo === 'err') animo(g, null);
  if (sel === g) pintaHilo(a.nombre); // si te has ido a otra mesa, el hilo se conserva para cuando vuelvas
}

/* ── bucle ──────────────────────────────────────────── */
const reloj = new THREE.Timer();
const tmp = new THREE.Vector3(), frente = new THREE.Vector3();
let zonaActual = '';

function bucle(){
  reloj.update();
  const t = reloj.getElapsed(), dt = Math.min(reloj.getDelta(), 0.05);

  // movimiento: teclado relativo a la cámara, o hacia el destino tocado
  let mx = 0, mz = 0;
  const dx = +(teclas.has('d') || teclas.has('arrowright')) - +(teclas.has('a') || teclas.has('arrowleft'));
  const dz = +(teclas.has('w') || teclas.has('arrowup')) - +(teclas.has('s') || teclas.has('arrowdown'));
  if (dx || dz){
    destino = null;
    frente.subVectors(controls.target, camera.position).setY(0).normalize();
    mx = frente.x * dz - frente.z * dx;
    mz = frente.z * dz + frente.x * dx;
  } else if (destino){
    const vx = destino.x - yo.position.x, vz = destino.z - yo.position.z, dist = Math.hypot(vx, vz);
    if (dist < 0.15) destino = null; else { mx = vx / dist; mz = vz / dist; }
  }
  let andando = false;
  if (mx || mz){
    const len = Math.hypot(mx, mz);
    const antesX = yo.position.x, antesZ = yo.position.z;
    mueve(mx / len * VEL * dt, mz / len * VEL * dt);
    andando = Math.hypot(yo.position.x - antesX, yo.position.z - antesZ) > 1e-4;
    if (!andando) destino = null; // bloqueado por una pared o una mesa
    else yo.rotation.y = Math.atan2(mx, mz);
  }
  if (!quieto) animaRobot(yoRobot, t, dt, { s: andando ? 2.2 : 1, amp: andando ? 0.22 : 0.07 });

  // la cámara sigue al personaje conservando el ángulo y la distancia elegidos
  tmp.set(yo.position.x, 1, yo.position.z).sub(controls.target).multiplyScalar(0.12);
  controls.target.add(tmp); camera.position.add(tmp);
  controls.update();

  // cercanía: la mesa con datos más próxima dentro del alcance
  let cerca = null, mejor = ALCANCE;
  for (const g of [...porNombre.values(), mesaJefe]){
    g.getWorldPosition(tmp);
    const d = Math.hypot(tmp.x - yo.position.x, tmp.z - yo.position.z);
    if (d < mejor){ mejor = d; cerca = g; }
  }
  if (cerca !== sel) selecciona(cerca);

  const z = despachos.find(d => { const o = d.userData.zona; return yo.position.x > o.x0 && yo.position.x < o.x1 && yo.position.z > o.z0 && yo.position.z < o.z1; });
  const nombre = z ? z.userData.nombre : 'Pasillo';
  if (nombre !== zonaActual){
    zonaActual = nombre;
    $('#zona').innerHTML = !z ? 'Pasillo' : z.userData.tuyo ? `<b>${esc(nombre)}</b>` : `Despacho · <b>${esc(nombre)}</b>`;
  }

  if (!quieto){
    for (const g of mesas){
      const u = g.userData;
      if (!u.robot.visible) continue;
      if (u.animo === 'hablando' && t > u.animoHasta) animo(g, null);
      const activo = u.act?.clave === 'cool';
      animaRobot(u.robot, t, dt, {
        s: u.animo === 'pensando' ? 1.7 : u.animo === 'hablando' ? 2.4 : activo ? 3.4 : u.datos ? 1.4 : 0.6,
        amp: u.animo === 'hablando' ? 0.16 : activo ? 0.26 : 0.07,
        mira: yo.position, habla: u.animo === 'hablando', piensa: u.animo === 'pensando',
      });
    }
    for (const gr of graficos) if (gr.visible) for (const b of gr.children){
      if (b.userData.k === undefined) continue;
      const h = 0.3 + (Math.sin(t * 1.6 + b.userData.k) * 0.5 + 0.5) * 0.7;
      b.scale.y = h; b.position.y = h * 0.25;
    }
    for (const [k, led] of leds.entries()) led.material.opacity = 0.35 + (Math.sin(t * 3 + k * 1.7) * 0.5 + 0.5) * 0.65;
    for (const h of plantas) h.rotation.z = Math.sin(t * 0.8 + h.position.x) * 0.04;
    for (const m of motas){ m.position.y = 1.4 + Math.sin(t * 0.8 + m.userData.fase) * 0.35; m.rotation.y = t * 0.4 + m.userData.fase; }
  }

  renderer.render(scene, camera);
  etiquetas.render(scene, camera);
}

const cargaBriefing = () => fetch('/api/acciones').then(r => r.ok ? r.json() : sinCuerpo(r)).catch(() => null);
async function carga(){
  const r = await fetch('/api/agentes');
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}
function sello(d, conectado = true){
  const claves = d.agentes.map(a => actividad(a).clave);
  const activos = claves.filter(c => c === 'cool').length;
  const clave = !conectado ? 'dim' : activos ? 'cool' : claves.includes('warm') ? 'warm' : 'dim';
  const texto = !conectado ? 'sin conexión con los agentes'
    : activos ? `${activos} ${activos === 1 ? 'agente activo' : 'agentes activos'} · ${d.conversaciones_total} conv · ${d.coste_total} USD`
    : d.agentes.length ? `${d.agentes.length} agentes · sin actividad hoy` : 'sin agentes';
  $('#estado').style.setProperty('--dot', CSSCOL[clave]);
  $('#estado span').textContent = texto;
}

async function principal(){
  let d, cfgs, conectado = true;
  [d, cfgs, briefing] = await Promise.all([
    carga().catch(() => { conectado = false; return { agentes:[], conversaciones_total:0, coste_total:0 }; }),
    fetch('despachos.json').then(r => r.ok ? r.json() : sinCuerpo(r)).catch(() => null),
    cargaBriefing(),
  ]);
  ultimoAgentes = d;
  if (!conectado) $('#aviso').textContent = 'No llego a los agentes: la oficina se muestra sin datos';
  if (!Array.isArray(cfgs) || !cfgs.length) cfgs = [{ nombre:'SIMBAI', agentes:d.agentes.map(a => a.nombre) }];
  const jefeCfg = cfgs.find(c => c.tuyo) || { nombre:'Tu despacho', tuyo:true };
  cfgs = cfgs.filter(c => !c.tuyo);
  if (!cfgs.length) cfgs = [{ nombre:'SIMBAI', agentes:[] }];

  // ponytail: los agentes sin despacho asignado van al primero
  const asignados = new Set(cfgs.flatMap(c => c.agentes || []));
  const sueltos = d.agentes.map(a => a.nombre).filter(n => !asignados.has(n));
  if (sueltos.length) (cfgs[0].agentes ??= []).push(...sueltos);

  suelo = construye(cfgs, jefeCfg);

  const datos = new Map(d.agentes.map(a => [a.nombre, a]));
  despachos.forEach((desp, i) => {
    if (desp.userData.tuyo){ pintaPlaca(desp); return; }
    const nombres = cfgs[i].agentes || [];
    desp.userData.mesas.forEach((m, k) => {
      const a = nombres[k] ? datos.get(nombres[k]) : null;
      if (nombres[k] && !a && conectado) console.warn(`despachos.json: el agente "${nombres[k]}" no existe en /api/agentes`);
      aplica(m, a || null, nombres[k] || null);
    });
    pintaPlaca(desp);
  });
  sello(d, conectado);

  // empiezas en tu despacho, junto a tu mesa, mirando a la puerta y al pasillo
  const jefe = despachos.at(-1);
  const inicio = jefe.localToWorld(new THREE.Vector3(1.4, 0, 0.5));
  const hacia = jefe.localToWorld(new THREE.Vector3(1.4, 0, 10)).sub(inicio).setY(0).normalize();
  yo.position.set(inicio.x, 0, inicio.z);
  yo.rotation.y = Math.atan2(hacia.x, hacia.z);
  encuadra();

  if (location.search === '?test') window.__oficina = {
    yo,
    puertaSimbai: despachos[0].localToWorld(new THREE.Vector3(0, 0, FONDO / 2 + 1.6)),
    mesaSimbai: despachos[0].userData.mesas[0].getWorldPosition(new THREE.Vector3()),
  };

  $('#ayuda span').textContent = tactil
    ? 'toca el suelo para moverte · acércate a un agente'
    : 'WASD o flechas para moverte · clic en el suelo para ir · acércate a un agente · arrastra para girar la cámara';
  $('#msg').remove();
  renderer.setAnimationLoop(bucle);

  // ponytail: el refresco actualiza mesas existentes; un despacho o agente nuevo aparece al recargar
  setInterval(async () => {
    try {
      const [n, b] = await Promise.all([carga(), cargaBriefing()]);
      ultimoAgentes = n; briefing = b ?? briefing;
      $('#aviso').textContent = '';
      const datosN = new Map(n.agentes.map(a => [a.nombre, a]));
      for (const g of mesas) if (g.userData.nombre) aplica(g, datosN.get(g.userData.nombre) || null, g.userData.nombre);
      despachos.forEach(pintaPlaca);
      sello(n);
      // las métricas se refrescan sin tocar el chat: hay un textarea que puede estar a medio escribir
      if (sel && $('#panel').classList.contains('on')) sel.userData.jefe ? pintaPanelJefe() : ($('#metricas').innerHTML = metricas(sel));
    } catch { /* el siguiente intento lo recupera */ }
  }, 30_000);
}
if (renderer) principal();
</script>
</body>
</html>
