<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oficina SIMBAI</title>
<meta name="description" content="Oficina 3D con once agentes de IA en cinco despachos: recepción reparte el trabajo y cada puesto muestra su estado en tiempo real.">
<meta name="theme-color" content="#141A2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<style>
/* Identidad SIMBAI, tomada de Proyectos/simbai-web-actual: fondo casi negro,
   verde lima como color de marca y violeta como acento secundario. */
:root{
  --night:#07070a; --elev:#0d0d13; --elev2:#131319; --elev3:#1a1a22;
  --cream:#eeeef2; --cream2:#8888a0; --cream3:#7e7e98;
  --accent:#c8ff00; --accent2:#a8d800; --accent-dim:rgba(200,255,0,.1);
  --violeta:#8b5cf6; --violeta-lt:#c4b5fd; --frio:#8b5cf6;
  --grad:linear-gradient(115deg,#c8ff00,#a8d800);
  --marca:#c8ff00;
  --tx:#eeeef2; --mut:#8888a0; --line:rgba(255,255,255,.11); --card:rgba(13,13,19,.88);
  --display:"Syne",system-ui,sans-serif; --body:"Geist",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --s-1:.25rem; --s-2:.5rem; --s-3:.75rem; --s-4:1rem; --s-5:1.5rem; --s-6:2rem;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--night);color:var(--tx);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
#escena{position:fixed;inset:0}
#escena canvas{display:block;touch-action:none}
#etiquetas{position:fixed;inset:0;pointer-events:none;z-index:1}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(4,4,6,.82) 100%)}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}

/* rótulo sobre cada despacho: solo el nombre, el estado va en el color del robot */
.placa{pointer-events:auto;cursor:pointer;white-space:nowrap;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--cream);padding:6px 12px;border-radius:999px;transition:border-color .16s}
.placa:hover,.placa.on{border-color:rgba(255,255,255,.28)}
.placa b{font-weight:700}
.placa span{color:var(--mut);font-weight:600}
.placa i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--frio);margin-left:8px;vertical-align:1px;box-shadow:0 0 10px currentColor}
.placa.activa i{background:var(--marca);box-shadow:0 0 10px var(--marca)}
.placa.parada i{background:var(--cream3);box-shadow:0 0 10px var(--cream3)}
.yo{pointer-events:none;font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--night);background:var(--cream);padding:4px 10px;border-radius:999px;box-shadow:0 8px 24px -8px rgba(238,238,242,.5)}
.bocadillo{pointer-events:none;max-width:230px;padding:9px 12px;border-radius:14px;border-bottom-left-radius:4px;background:var(--cream);color:var(--night);font:400 12.5px/1.4 var(--body);white-space:normal;box-shadow:0 12px 30px -12px rgba(0,0,0,.6)}

header{position:fixed;top:calc(var(--safe-t) + 18px);left:24px;right:24px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;pointer-events:auto}
.brand a{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;color:var(--mut);text-decoration:none}
.brand a:hover{color:var(--cream)}
.brand a svg{width:16px;height:16px}
.brand__mark{width:12px;height:12px;border-radius:50%;background:var(--marca);box-shadow:0 0 16px var(--marca)}
.brand__name{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.06em;line-height:1}
.brand__sub{margin-top:3px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.status{display:flex;align-items:center;gap:9px;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap}
.status i{width:9px;height:9px;border-radius:50%;background:var(--dot,var(--marca));box-shadow:0 0 12px var(--dot,var(--marca));animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.7}}
#aviso{position:fixed;top:calc(var(--safe-t) + 74px);left:50%;transform:translateX(-50%);z-index:5;font-size:12px;color:var(--amber);padding:7px 14px;border-radius:999px;pointer-events:none;white-space:nowrap}
#aviso:empty{display:none}

footer{position:fixed;left:24px;right:24px;bottom:calc(var(--safe-b) + 18px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
#zona{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:8px 14px;border-radius:999px;white-space:nowrap}
#zona b{color:var(--cream)}
.hint{display:flex;align-items:center;gap:12px;font-size:11.5px;color:var(--mut);letter-spacing:.02em;pointer-events:auto}
.hint span{transition:opacity .6s}
.hint.off span{opacity:0}
.hint button{background:none;border:1px solid rgba(255,255,255,.18);color:var(--cream2);border-radius:999px;padding:6px 13px;font:500 11.5px var(--body);cursor:pointer;white-space:nowrap;flex:none}
.hint button:hover{color:#07070a;background:var(--grad);border-color:transparent}

aside{
  position:fixed; top:calc(var(--safe-t) + 84px); right:24px; width:min(330px,calc(100vw - 48px)); z-index:6;
  padding:18px; border-radius:22px; box-shadow:0 30px 60px -30px rgba(0,0,0,.8);
  max-height:calc(100vh - var(--safe-t) - 110px); overflow-y:auto;
  transform:translateX(24px); opacity:0; pointer-events:none; transition:.28s cubic-bezier(.22,1,.36,1);
}
aside.on{transform:none;opacity:1;pointer-events:auto}
aside .top{display:flex;align-items:center;gap:10px}
aside .nm{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.02em;line-height:1}
aside .mod{font:500 10px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);background:rgba(255,255,255,.055);padding:3px 8px;border-radius:6px}
aside .cerrar{margin-left:auto;background:none;border:0;color:var(--mut);cursor:pointer;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
aside .cerrar:hover{background:rgba(255,255,255,.08);color:var(--cream)}
aside .cerrar svg{width:14px;height:14px}
/* una fila por agente del despacho */
.puesto{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.puesto:last-of-type{border-bottom:0}
.puesto i{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px;box-shadow:0 0 10px currentColor}
.puesto .rol{font-family:var(--display);font-weight:700;font-size:14px;line-height:1.2}
.puesto .sit{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-top:3px}
.puesto .det{font-size:12.5px;line-height:1.5;margin-top:6px}
.puesto .cuando{font:10.5px var(--mono);color:var(--mut);margin-top:5px}
aside .pie{font:11px/1.7 var(--mono);color:var(--mut);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}

/* chat con la asistenta de recepción */
.chat{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.chat .hilo{display:flex;flex-direction:column;gap:8px;max-height:200px;overflow-y:auto;padding-right:2px}
.chat .hilo:empty{display:none}
.chat .m{max-width:88%;padding:9px 12px;border-radius:14px;font-size:12.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.chat .m.mio{align-self:flex-end;background:var(--accent);color:var(--night);border-bottom-right-radius:5px}
.chat .m.el{align-self:flex-start;background:rgba(255,255,255,.08);border-bottom-left-radius:5px}
.chat .m.err{align-self:stretch;background:rgba(255,107,74,.16);border:1px solid rgba(255,107,74,.4);font-size:12px}
.chat .meta{align-self:flex-start;font:10.5px var(--mono);color:var(--mut);margin-top:-4px}
.chat .dots::after{content:'…';display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.chat .motores{display:flex;gap:6px;margin-top:10px}
.chat .motores button{flex:1;background:none;border:1px solid rgba(255,255,255,.11);color:var(--mut);border-radius:999px;padding:6px 10px;font:500 11px var(--body);cursor:pointer;white-space:nowrap}
.chat .motores button.on{background:var(--grad);color:#07070a;border-color:transparent;font-weight:600}
.chat form{display:flex;gap:8px;margin-top:8px;align-items:flex-end}
.chat textarea{flex:1;resize:none;background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:14px;color:var(--cream);font:400 13px/1.4 var(--body);padding:9px 12px;outline:none;min-height:38px;max-height:96px}
.chat textarea:focus{border-color:rgba(255,255,255,.25)}
.chat textarea::placeholder{color:var(--mut)}
.chat form button{width:38px;height:38px;border-radius:50%;border:0;background:var(--grad);color:var(--night);cursor:pointer;flex:none;display:grid;place-items:center}
.chat form button svg{width:16px;height:16px}
.chat form button:disabled,.chat textarea:disabled{opacity:.5;cursor:default}
.chat .nota{font-size:10.5px;color:var(--mut);margin-top:8px;line-height:1.5}
.chat .nota code{display:block;margin:6px 0;padding:7px 9px;border-radius:8px;background:rgba(255,255,255,.055);color:var(--cream);font:10.5px/1.5 var(--mono);user-select:all;word-break:break-all}

.msg{position:fixed;inset:0;z-index:4;display:grid;place-items:center;text-align:center;color:var(--mut);font-size:13.5px;padding:20px;background:var(--night)}
.msg b{display:block;font-family:var(--display);color:var(--cream);font-size:18px;margin-bottom:6px}

/* modo embed: HUD mínimo para iframe */
body.embed header{top:12px;left:14px;right:14px}
body.embed .brand__sub,body.embed footer .hint span,body.embed #zona{display:none}
body.embed .brand__name{font-size:16px}

@media(max-width:768px){
  header{left:16px;right:16px}
  .brand__sub{display:none}
  footer{left:16px;right:16px;flex-wrap:wrap}
  aside{top:auto;right:16px;left:16px;bottom:calc(var(--safe-b) + 66px);width:auto;max-height:70vh;transform:translateY(24px)}
  aside.on{transform:none}
}
@media(max-width:480px){.status{display:none}.brand__name{font-size:17px}}
/* En vertical seis rótulos de texto no caben a lo ancho: se quedan en una pastilla con la
   inicial y el punto de estado. El nombre completo sigue al tocar el despacho. */
@media(max-aspect-ratio:1/1){
  .placa{font-size:11px;padding:0;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;position:relative}
  .placa b,.placa span{display:none}
  .placa::before{content:attr(data-ini);font-weight:700}
  .placa i{position:absolute;margin:0;transform:translate(9px,-9px);width:8px;height:8px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="escena"></div>
<div id="etiquetas"></div>
<div class="vignette"></div>

<header>
  <div class="brand">
    <a class="card" href="/" aria-label="Volver a SIMBAI OS"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
    <span class="brand__mark"></span>
    <div><div class="brand__name" id="marca">OFICINA SIMBAI</div><div class="brand__sub" id="lema">trece agentes, seis despachos</div></div>
  </div>
  <div class="status card" id="estado"><i></i><span>cargando…</span></div>
</header>
<div id="aviso" class="card"></div>

<aside id="panel" class="card"></aside>

<footer>
  <div id="zona" class="card">Planta</div>
  <div class="hint" id="ayuda"><span></span><button type="button" id="vista">Vista general</button></div>
</footer>
<div class="msg" id="msg"><b>Abriendo la oficina…</b>Cargando la escena 3D</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const titulo = n => String(n).replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
const tactil = matchMedia('(pointer: coarse)').matches;

/* ── parámetros de URL ──────────────────────────────── */
const Q = new URLSearchParams(location.search);
const flag = (n, pd) => Q.has(n) ? Q.get(n) !== '0' : pd;
const CFG = {
  embed: flag('embed', false),
  name: Q.get('name') || 'OFICINA SIMBAI',
  tagline: Q.get('tagline') || 'trece agentes, seis despachos',
  accent: /^#[0-9a-f]{3,8}$/i.test(Q.get('accent') || '') ? Q.get('accent') : '#c8ff00',
  labels: flag('labels', true),
  // el panel de estados vive aquí por defecto; ?estado= lo cambia y ?estado= vacío lo apaga
  estado: Q.has('estado') ? Q.get('estado') : 'http://localhost:8080/estado.json',
};
CFG.chat = flag('chat', !CFG.embed);
if (CFG.embed) document.body.classList.add('embed');
document.documentElement.style.setProperty('--marca', CFG.accent);
$('#marca').textContent = CFG.name;
$('#lema').textContent = CFG.tagline;

/* ── paleta y plantilla de la oficina ───────────────── */
// Paleta SIMBAI (Proyectos/simbai-web-actual): casi negro, lima de marca y violeta.
const PAL = {
  night:0x07070a, navy:0x1a1a22, navy2:0x232330, cream:0xeeeef2,
  coral:0xc8ff00, mint:0xc8ff00, sky:0x8b5cf6, amber:0xc8ff00, plum:0x555568,
  wood:0x26262f, wood2:0x1c1c24, leaf:0x8fbf2a, leaf2:0xa8d800, white:0xeeeef2,
};
const MARCA = new THREE.Color(CFG.accent).getHex();
// trabajando = lima de marca; libre = violeta; parado = gris apagado
const SIT = {
  trabajando: { hex:MARCA, css:CFG.accent, factor:1, etiqueta:'Trabajando' },
  libre:      { hex:PAL.sky, css:'#8b5cf6', factor:.45, etiqueta:'Libre' },
  parado:     { hex:PAL.plum, css:'#7e7e98', factor:.4, etiqueta:'Parado' },
};
const situacion = s => SIT[s] ? s : 'libre';

const RECEPCION = { id:'recepcion', nombre:'Recepción', puestos:['asistenta'] };
// despacho de los agentes que existen de verdad en agents/: su estado, coste y chat salen
// de /api/agentes, no del endpoint de estados
const SIMBAI = { id:'simbai', nombre:'SIMBAI', reales:true, puestos:['captacion-crm', 'recepcion-abogados'] };
const DESPACHOS = [
  { id:'mercados', nombre:'Mercados', puestos:['explorador', 'analista'] },
  { id:'desarrollo', nombre:'Desarrollo', puestos:['constructor', 'revisor'] },
  { id:'automatizaciones', nombre:'Automatizaciones', puestos:['disenador-flujos', 'integrador'] },
  { id:'visuales', nombre:'Visuales', puestos:['director-arte', 'maquetador'] },
  { id:'auditoria', nombre:'Auditoría', puestos:['auditor-tecnico', 'auditor-negocio'] },
  SIMBAI,
];
const ROL = {
  asistenta:'Asistenta', explorador:'Explorador', analista:'Analista',
  constructor:'Constructor', revisor:'Revisor',
  'disenador-flujos':'Diseñador de flujos', integrador:'Integrador',
  'director-arte':'Director de arte', maquetador:'Maquetador',
  'auditor-tecnico':'Auditor técnico', 'auditor-negocio':'Auditor de negocio',
  'captacion-crm':'Captación CRM', 'recepcion-abogados':'Recepción Abogados',
};
const REALES = new Set(SIMBAI.puestos);

// Orden de una oficina real: desde la entrada hacia el fondo, siguiendo el recorrido de un
// encargo. Primero lo que trata con fuera (captación y los agentes que atienden), en medio la
// producción, y al fondo lo técnico y el control, que son los que necesitan menos ruido.
// Las dos filas se leen en paralelo: lo que se pasa trabajo queda enfrentado.
// Recepción cierra el pasillo por el sureste, así que la fila sur se lee de derecha a
// izquierda: lo más cercano a la entrada va al final de su lista.
const ORDEN = {
  norte: ['automatizaciones', 'visuales', 'mercados'],
  sur:   ['auditoria', 'desarrollo', 'simbai'],
};

const EJEMPLO = {
  despachos: {
    explorador: { despacho:'mercados', situacion:'trabajando', detalle:'busca oportunidades en hoteles de Málaga', cuando:new Date().toISOString() },
    maquetador: { despacho:'visuales', situacion:'trabajando', detalle:'monta la landing del despacho de abogados', cuando:new Date().toISOString() },
    'auditor-tecnico': { despacho:'auditoria', situacion:'trabajando', detalle:'revisa el rendimiento de tres webs de cliente', cuando:new Date().toISOString() },
    revisor: { despacho:'desarrollo', situacion:'parado', detalle:'el motor local no responde', cuando:new Date().toISOString() },
    asistenta: { despacho:'recepcion', situacion:'libre', detalle:'', cuando:new Date().toISOString() },
  },
  ultimo_cambio: new Date().toISOString(),
};

/* ── medidas ────────────────────────────────────────── */
const PASILLO = 6, FONDO = 8.4, ALTO = 2.2, GROSOR = 0.15, PUERTA = 2.2, ANCHO = 9.4;
const RADIO = 0.35, VEL = 3.6, ROBOT = 0.62;

// normaliza el JSON del endpoint: todo puesto conocido queda con una situación.
// Los puestos de SIMBAI se saltan: sus datos vienen de /api/agentes, no del endpoint.
function normaliza(datos){
  const dch = datos?.despachos && typeof datos.despachos === 'object' ? datos.despachos : {};
  const out = {};
  for (const { id, puestos, reales } of [RECEPCION, ...DESPACHOS]){
    if (reales) continue;
    for (const p of puestos){
      const d = dch[p] || {};
      out[p] = {
        despacho: d.despacho || id,
        situacion: situacion(d.situacion),
        detalle: typeof d.detalle === 'string' ? d.detalle : '',
        cuando: d.cuando || null,
      };
    }
  }
  return out;
}

// un agente real trabaja si ha conversado en la última hora, está libre si lo hizo
// esta semana, y se considera parado si lleva más tiempo o su carpeta no existe
function deAgente(a){
  if (!a || !a.existe) return { despacho:'simbai', situacion:'parado', detalle:'la carpeta del agente no existe', cuando:null, agente:a || null };
  const h = a.ultima ? (Date.now() - new Date(a.ultima.replace(' ', 'T') + ':00Z')) / 36e5 : Infinity;
  const situacion = h < 1 ? 'trabajando' : h < 24 * 7 ? 'libre' : 'parado';
  const detalle = a.conversaciones
    ? `${a.conversaciones} ${a.conversaciones === 1 ? 'conversación' : 'conversaciones'} · ${a.turnos} turnos · ${a.coste} USD`
    : 'sin conversaciones registradas';
  return { despacho:'simbai', situacion, detalle, cuando:a.ultima ? a.ultima.replace(' ', 'T') + ':00Z' : null, agente:a };
}
function hace(iso){
  if (!iso) return '';
  const f = new Date(iso);
  if (Number.isNaN(+f)) return '';
  const m = (Date.now() - f) / 6e4;
  return m < 1 ? 'hace menos de un minuto' : m < 60 ? `hace ${Math.round(m)} min`
    : m < 1440 ? `hace ${Math.round(m / 60)} h` : `hace ${Math.round(m / 1440)} días`;
}

function libre(x, z, lista = obstaculos){
  return !lista.some(o => x + RADIO > o.x0 && x - RADIO < o.x1 && z + RADIO > o.z0 && z - RADIO < o.z1);
}

if (Q.has('test')){
  const n = normaliza(EJEMPLO);
  console.assert(Object.keys(n).length === 11, 'once puestos del endpoint');
  console.assert(!n['captacion-crm'], 'los agentes reales no salen del endpoint');
  const hace = h => new Date(Date.now() - h * 36e5).toISOString().slice(0, 16).replace('T', ' ');
  console.assert(deAgente({ existe:true, ultima:hace(0.2), conversaciones:3, turnos:9, coste:0.1 }).situacion === 'trabajando', 'real trabajando');
  console.assert(deAgente({ existe:true, ultima:hace(30), conversaciones:1, turnos:2, coste:0.1 }).situacion === 'libre', 'real libre');
  console.assert(deAgente({ existe:true, ultima:hace(24 * 10), conversaciones:1, turnos:2, coste:0.1 }).situacion === 'parado', 'real parado');
  console.assert(deAgente(null).situacion === 'parado', 'sin agente = parado');
  console.assert(n.explorador.situacion === 'trabajando' && n.revisor.situacion === 'parado', 'situaciones del ejemplo');
  console.assert(n.integrador.situacion === 'libre' && n.integrador.detalle === '', 'ausente = libre');
  console.assert(normaliza(null).analista.situacion === 'libre', 'sin datos = libre');
  console.assert(normaliza({ despachos:{ analista:{ situacion:'inventada' } } }).analista.situacion === 'libre', 'situacion desconocida = libre');
  const caja = [{ x0:-1, x1:1, z0:-1, z1:1 }];
  console.assert(!libre(0, 0, caja) && libre(1.5, 0, caja), 'colision');
  const colocados = [...ORDEN.norte, ...ORDEN.sur];
  console.assert(colocados.length === new Set(colocados).size, 'ningún despacho repetido en ORDEN');
  console.assert(DESPACHOS.every(d => colocados.includes(d.id)), 'todos los despachos tienen sitio');
  console.assert(colocados.every(id => DESPACHOS.some(d => d.id === id)), 'ORDEN no nombra despachos inexistentes');
  console.log('ok normaliza y colision');
}

function robot(hex, escala = ROBOT){
  const color = new THREE.Color(hex);
  const luminoso = k => { const m = new THREE.MeshStandardMaterial({ color, emissive:color, emissiveIntensity:k, toneMapped:false }); m.userData.base = k; return m; };
  const g = new THREE.Group();

  const cabeza = new THREE.Group(); cabeza.position.y = 0.72;
  const craneo = new THREE.Mesh(G.cabeza, M.cream); craneo.castShadow = true;
  const visor = new THREE.Mesh(G.visor, M.night); visor.position.set(0, 0.04, 0.4);
  const ojoI = new THREE.Mesh(G.ojo, luminoso(2.4)); ojoI.position.set(-0.17, 0.06, 0.47);
  const ojoD = ojoI.clone(); ojoD.position.x = 0.17;
  const boca = new THREE.Mesh(G.boca, luminoso(1.4));
  boca.position.set(0, -0.16, 0.43); boca.rotation.z = Math.PI / 2; boca.scale.y = 0.45;
  const aurI = new THREE.Mesh(G.auricular, M.navy); aurI.position.x = -0.56;
  const aurD = new THREE.Mesh(G.auricular, M.navy); aurD.position.x = 0.56;
  const palo = new THREE.Mesh(G.antena, M.navy); palo.position.y = 0.48;
  const antena = new THREE.Mesh(G.bolita, luminoso(2.6)); antena.position.y = 0.66;
  cabeza.add(craneo, visor, ojoI, ojoD, boca, aurI, aurD, palo, antena);

  const cuerpo = new THREE.Mesh(G.cuerpo, M.white); cuerpo.position.y = -0.02; cuerpo.castShadow = true;
  const nucleo = new THREE.Mesh(G.nucleo, luminoso(2.8)); nucleo.position.set(0, 0.02, 0.35);
  // ponytail: sin luz propia en cada robot. Doce PointLight encarecen todos los materiales;
  // el estado ya se ve en el emisivo, el halo y la baliza de la mesa.
  const luz = { color, intensity:0, visible:false, position:{ set(){} } };
  const manoI = new THREE.Mesh(G.mano, M.navy); manoI.position.set(-0.78, -0.1, 0.05); manoI.castShadow = true;
  const manoD = new THREE.Mesh(G.mano, M.navy); manoD.position.set(0.78, -0.1, 0.05); manoD.castShadow = true;
  const base = new THREE.Mesh(G.base, mat(PAL.navy, { roughness:.4, flatShading:true })); base.position.y = -0.56; base.castShadow = true;
  const anillo1 = new THREE.Mesh(G.anillo1, luminoso(2)); anillo1.position.y = -0.78; anillo1.rotation.x = Math.PI / 2;
  const anillo2 = new THREE.Mesh(G.anillo2, luminoso(1.4)); anillo2.position.y = -0.92; anillo2.rotation.x = Math.PI / 2;
  const halo = new THREE.Mesh(G.halo, new THREE.MeshBasicMaterial({ color, transparent:true, opacity:.16, toneMapped:false }));
  halo.position.y = -1.18; halo.rotation.x = -Math.PI / 2;

  g.add(cabeza, cuerpo, nucleo, manoI, manoD, base, anillo1, anillo2, halo);
  g.scale.setScalar(escala);
  g.position.y = 1.18 * escala;
  Object.assign(g.userData, {
    cabeza, ojos:[ojoI, ojoD], boca, manos:[manoI, manoD], anillos:[anillo1, anillo2], nucleo, luz, halo, color, factor:1,
    lum:[ojoI.material, boca.material, antena.material, nucleo.material, anillo1.material, anillo2.material],

}
function colorea(r, hex, factor = 1){
  const u = r.userData;
  u.color.setHex(hex); u.factor = factor;
  for (const m of u.lum){ m.color.copy(u.color); m.emissive.copy(u.color); m.emissiveIntensity = m.userData.base * factor; }
  u.halo.material.color.copy(u.color); u.halo.material.opacity = 0.16 * factor;
}
function animaRobot(r, t, dt, opts = {}){
  const u = r.userData, s = opts.s || 1, k = r.scale.x;
  r.position.y = 1.18 * k + Math.sin(t * 1.4 * s + u.fase) * 0.09 * k;
  r.rotation.z = Math.sin(t * 0.9 + u.fase) * 0.03;
  u.anillos[0].rotation.z += dt * 0.9 * s; u.anillos[1].rotation.z -= dt * 1.4 * s;
  const parpadeo = Math.sin(t * 1.3 + u.fase) > 0.985 ? 0.12 : 1;
  for (const o of u.ojos) o.scale.y += (parpadeo - o.scale.y) * 0.4;
  const amp = opts.amp ?? 0.07;
  u.manos[0].position.y = Math.sin(t * 2.6 * s + u.fase) * amp - 0.1;
  u.manos[1].position.y = Math.sin(t * 2.6 * s + u.fase + Math.PI / 2) * amp - 0.1;
  u.nucleo.scale.setScalar(1 + Math.sin(t * 3 * s) * 0.14);
  u.boca.scale.y += ((opts.habla ? 0.5 + Math.abs(Math.sin(t * 12)) * 1.6 : 0.45) - u.boca.scale.y) * 0.3;
  let giro = 0;
  if (opts.mira){
    const p = r.worldToLocal(opts.mira.clone());
    if (Math.hypot(p.x, p.z) < 12) giro = THREE.MathUtils.clamp(Math.atan2(p.x, p.z), -0.55, 0.55);
  }
  u.cabeza.rotation.y += (giro - u.cabeza.rotation.y) * 0.08;
}
// en reposo el robot solo flota: una interpolación, sin senos ni anillos
function reposa(r, t){
  const u = r.userData, k = r.scale.x;
  r.position.y = 1.18 * k + Math.sin(t * 0.6 + u.fase) * 0.03 * k;
}

/* ── puesto de trabajo ──────────────────────────────── */
// Los dos puestos comparten una mesa en L: el robot mira hacia el centro del despacho.
function puesto(id, sala, x, z, giro){
  const g = new THREE.Group();
  g.position.set(x, 0, z); g.rotation.y = giro;
  g.userData.puesto = id;

  g.add(caja(2.0, 0.1, 1.0, M.cream, 0, 0.76, 0, 0.05));
  for (const [px, pz] of [[-0.85, -0.38], [0.85, -0.38], [-0.85, 0.38], [0.85, 0.38]]) g.add(cil(0.05, 0.05, 0.72, M.navy, px, 0.36, pz, 8));
  const mon = monitor(1.25, 0.74, 0.05, 0.81, 0.28); g.add(mon);
  g.add(caja(0.68, 0.04, 0.24, M.white, -0.02, 0.83, -0.12, 0.02));
  const bal = baliza(0.82, -0.26); g.add(bal);
  g.add(silla(0, -0.85));
  const rob = robot(PAL.sky); rob.position.z = -0.85; g.add(rob);

  const bdiv = document.createElement('div'); bdiv.className = 'bocadillo';
  const bocadillo = new CSS2DObject(bdiv);
  bocadillo.position.set(0.5, 1.85, -0.85); bocadillo.center.set(0, 1); bocadillo.visible = false;
  g.add(bocadillo);

  Object.assign(g.userData, { sala, robot:rob, baliza:bal, pantalla:mon.userData.pantalla, barras:mon.userData.barras, bocadillo, estado:null });
  puestos.set(id, g);
  return g;
}

// pinta un puesto según su estado; sin animación si no trabaja
function aplica(id, e){
  const g = puestos.get(id);
  if (!g) return;
  const u = g.userData, s = SIT[e.situacion];
  u.estado = e;
  colorea(u.robot, s.hex, s.factor);
  u.baliza.userData.foco.material.emissive.setHex(s.hex);
  u.baliza.userData.foco.material.emissiveIntensity = e.situacion === 'trabajando' ? 2.2 : 0.9;
  u.baliza.userData.luz.color.setHex(s.hex);
  u.baliza.userData.luz.intensity = e.situacion === 'trabajando' ? 2.4 : 0.5;
  u.pantalla.material.emissive.setHex(s.hex);
  u.pantalla.material.emissiveIntensity = e.situacion === 'trabajando' ? 1.2 : e.situacion === 'libre' ? 0.25 : 0;
  u.barras.visible = e.situacion === 'trabajando';
}

/* ── sala ───────────────────────────────────────────── */
function pared(g, w, d, x, z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, ALTO, d), M.pared);
  m.position.set(x, ALTO / 2, z);
  m.castShadow = m.receiveShadow = true;
  g.add(m);
  g.userData.paredes.push({ m, w, d });
}
function rodapie(g, w, d, x, z){ const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.24, d), M.navy); m.position.set(x, 0.12, z); g.add(m); }

// Sala con la puerta en +z. Los dos puestos van en L junto a la esquina del fondo.
function sala(cfg, esRecepcion = false){
  const g = new THREE.Group();
  const W = esRecepcion ? 8.2 : ANCHO, D = esRecepcion ? 6.4 : FONDO, t = GROSOR;
  g.userData.paredes = [];

  const suelo = new THREE.Mesh(new THREE.PlaneGeometry(W - t, D - t), mat(esRecepcion ? PAL.navy2 : PAL.wood2, { roughness:.95 }));
  suelo.rotation.x = -Math.PI / 2; suelo.position.y = 0.004; suelo.receiveShadow = true;
  g.add(suelo);

  pared(g, W + t, t, 0, -D / 2);
  pared(g, t, D, -W / 2, 0);
  pared(g, t, D, W / 2, 0);
  const hoja = (W - PUERTA) / 2;
  pared(g, hoja, t, -(PUERTA + hoja) / 2, D / 2);
  pared(g, hoja, t, (PUERTA + hoja) / 2, D / 2);
  rodapie(g, W - t, 0.06, 0, -D / 2 + t / 2 + 0.03);
  rodapie(g, 0.06, D - t, -W / 2 + t / 2 + 0.03, 0);
  rodapie(g, 0.06, D - t, W / 2 - t / 2 - 0.03, 0);

  ventana(g, 0, -D / 2 + t / 2 + 0.01);

  const alfombra = new THREE.Mesh(new THREE.CircleGeometry(Math.min(W, D) * 0.2, 28), M.navy2);
  alfombra.rotation.x = -Math.PI / 2; alfombra.position.set(0, 0.014, D * 0.15); alfombra.receiveShadow = true;
  const ribete = new THREE.Mesh(new THREE.RingGeometry(Math.min(W, D) * 0.16, Math.min(W, D) * 0.178, 28), M.coral);
  ribete.rotation.x = -Math.PI / 2; ribete.position.set(0, 0.018, D * 0.15);
  g.add(alfombra, ribete);

  const maceta = planta(W / 2 - 0.8, D / 2 - 1.0, 0.9); g.add(maceta);
  bloques.push([maceta, -0.35, 0.35, -0.35, 0.35]);

  if (esRecepcion){
    // mostrador en U y la asistenta detrás, de cara a la puerta
    const p = puesto(cfg.puestos[0], cfg.id, 0, -1.2, Math.PI);
    g.add(p);
    g.add(caja(4.2, 1.0, 0.3, M.wood, 0, 0.5, 0.5, 0.05));
    g.add(caja(4.2, 0.09, 0.66, M.cream, 0, 1.03, 0.52, 0.03));
    for (const sx of [-2.0, 2.0]){ g.add(caja(0.3, 1.0, 1.0, M.wood, sx, 0.5, 0.05, 0.05)); }
    bloques.push([g, -2.2, 2.2, 0.1, 0.9]);
  } else {
    // dos puestos en L sobre la misma esquina: se miran, el trabajo pasa de uno a otro
    g.add(puesto(cfg.puestos[0], cfg.id, -1.15, -D / 2 + 1.35, 0));
    g.add(puesto(cfg.puestos[1], cfg.id, 1.5, -D / 2 + 2.6, -Math.PI / 2));
    // pizarra compartida, en la pared que ambos tienen a la vista
    const board = new THREE.Group(); board.position.set(W / 2 - 0.35, 1.3, -D / 2 + 1.6);
    board.add(caja(1.8, 1.2, 0.1, M.white, 0, 0, 0, 0.03));

    });

  }

  Object.assign(g.userData, { cfg, W, D, div, placa });

}

/* ── planta: recepción al frente, despachos a los lados ── */
const edificio = new THREE.Group();
scene.add(edificio);
let limites = { x0:-10, x1:10, z0:-10, z1:10 };

function construye(){
  // Dos filas enfrentadas por el pasillo, repartidas para que la planta quede lo más
  // cuadrada posible: en línea medía 35 m de ancho y no cabía en una pantalla de móvil.
  const porId = new Map(DESPACHOS.map(d => [d.id, d]));
  const usados = new Set([...ORDEN.norte, ...ORDEN.sur]);
  const filas = [
    ORDEN.norte.map(id => porId.get(id)).filter(Boolean),
    ORDEN.sur.map(id => porId.get(id)).filter(Boolean),
  ];
  // un despacho nuevo que no esté en ORDEN no desaparece: se añade a la fila más corta
  for (const d of DESPACHOS) if (!usados.has(d.id)) filas[filas[0].length <= filas[1].length ? 0 : 1].push(d);
  filas.forEach((fila, lado) => {
    // cada fila se centra sobre el pasillo, así la que tiene menos salas no descuadra la planta
    const desplazamiento = (Math.max(...filas.map(f => f.length)) - fila.length) * (ANCHO + GROSOR) / 2;
    fila.forEach((cfg, i) => {
      const s = sala(cfg);
      s.position.set(desplazamiento + i * (ANCHO + GROSOR) + ANCHO / 2, 0, (lado ? 1 : -1) * (PASILLO / 2 + FONDO / 2));
      if (lado) s.rotation.y = Math.PI;
      edificio.add(s);
    });
  });
  const largo = Math.max(...filas.map(f => f.length)) * (ANCHO + GROSOR);

  // recepción al frente del pasillo, no en un extremo: así la planta no se alarga y es lo
  // primero que se ve al entrar
  const rec = sala(RECEPCION, true);
  rec.position.set(largo / 2, 0, PASILLO / 2 + FONDO + 6.4 / 2 + 1.2); rec.rotation.y = Math.PI;
  edificio.add(rec);
  recepcion = rec;

  edificio.position.x = -largo / 2;
  scene.updateMatrixWorld(true);

  for (const s of salas.values()){
    for (const { m, w, d } of s.userData.paredes) obstaculos.push(aabb(m, -w / 2, w / 2, -d / 2, d / 2));
    s.userData.zona = aabb(s, -s.userData.W / 2, s.userData.W / 2, -s.userData.D / 2, s.userData.D / 2);
  }
  for (const g of puestos.values()) obstaculos.push(aabb(g, -1.1, 1.1, -1.25, 0.6));
  for (const [obj, ...r] of bloques) obstaculos.push(aabb(obj, ...r));
  limites = { x0:-largo / 2 - 6.4 - 2, x1:largo / 2 + 2, z0:-(PASILLO / 2 + FONDO + 1.5), z1:PASILLO / 2 + FONDO + 1.5 };

  const w = largo + 26, prof = FONDO * 2 + PASILLO + 20;
  const suelo = new THREE.Mesh(new THREE.PlaneGeometry(w, prof), M.wood);
  suelo.rotation.x = -Math.PI / 2; suelo.receiveShadow = true; suelo.userData.esSuelo = true;
  scene.add(suelo);
  for (let zz = -prof / 2; zz < prof / 2; zz += 1.6){
    const tabla = new THREE.Mesh(new THREE.PlaneGeometry(w, 0.06), M.wood2);
    tabla.rotation.x = -Math.PI / 2; tabla.position.set(0, 0.002, zz);
    scene.add(tabla);
  }
  scene.fog = new THREE.Fog(PAL.night, 55, 150); // en móvil la cámara se aleja: con 80 la planta se apagaba

  // luz neutra y fría: el lima tiene que destacar, no competir con una luz de color
  scene.add(new THREE.HemisphereLight(0xb9c6e8, 0x2a2a36, 0.7));
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const sol = new THREE.DirectionalLight(0xf2f4ff, 2.0);
  sol.position.set(-7, 14, 9); sol.castShadow = true;
  sol.shadow.mapSize.set(2048, 2048);
  Object.assign(sol.shadow.camera, { left:-largo / 2 - 10, right:largo / 2 + 6, top:prof / 2, bottom:-prof / 2, near:1, far:70 });
  sol.shadow.bias = -0.0005;
  scene.add(sol);
  const frio = new THREE.DirectionalLight(PAL.sky, 0.55); frio.position.set(6, 5, 8); scene.add(frio);
  return suelo;
}

async function envia(){
  const ta = $('#texto'), texto = ta?.value.trim();
  if (!texto || charla.pensando) return;
  ta.value = '';
  charla.turnos.push({ tipo:'mio', texto }); charla.pensando = true;
  pintaHilo();
  const con = interlocutor(charla.sala);
  const g = puestos.get(charla.sala === 'simbai' ? con : 'asistenta');
  if (g) animo(g, 'pensando');
  try {
    const r = await fetch('/api/hablar', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'X-Token':TK },
      body:JSON.stringify({ agente:con, mensaje:texto, sesion:charla.sesion, motor:charla.motor }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) charla.turnos.push({ tipo:'err', texto:
      r.status === 401 ? 'Token no válido: abre SIMBAI OS con tu enlace en este navegador y vuelve.'
      : (r.status === 404 || r.status === 501) ? 'El chat vive en SIMBAI OS (puerto 8790), no en el servidor mínimo.'
      : r.status === 503 ? 'El puente de agentes está parado. En PowerShell: powershell -File Apps\\simbai-os\\start.ps1'
      : d.error || `HTTP ${r.status}` });
    else { charla.turnos.push({ tipo:'el', texto:d.texto, coste:d.coste, ms:d.ms, motor:d.motor }); if (g) di(g, d.texto || ''); }
  } catch {
    charla.turnos.push({ tipo:'err', texto:'Sin conexión con el PC.' });
  }
  charla.pensando = false;
  if (charla.turnos.at(-1).tipo === 'err' && g) animo(g, null);
  pintaHilo();
}

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 5; controls.maxDistance = 46; // lo sube encuadraGeneral si la planta pide más

const vistaGeneral = { pos:new THREE.Vector3(), tgt:new THREE.Vector3() };
let vuelo = null; // {pos, tgt} destino de cámara mientras dura la interpolación

// La planta entera cabe en pantalla. La fórmula teórica falla porque los rótulos miden en
// píxeles y no encogen al alejar, así que se proyectan las ocho esquinas de la caja y se
// aleja la cámara hasta que todas caen dentro del margen pedido.
const MARGEN = 0.97; // fracción de la pantalla que puede ocupar la planta
function encuadraGeneral(){
  // la caja se arma con las zonas de las salas, no con setFromObject: los haces de luz del
  // suelo y las sombras sobresalen del edificio y descentraban el encuadre
  const caja = new THREE.Box3();
  for (const s of salas.values()){
    const z = s.userData.zona;
    if (z) caja.expandByPoint(new THREE.Vector3(z.x0, 0, z.z0)).expandByPoint(new THREE.Vector3(z.x1, ALTO, z.z1));
  }
  if (caja.isEmpty()){ vistaGeneral.tgt.set(0, 1, 0); vistaGeneral.pos.set(6, 22, 26); return; }
  const c = caja.getCenter(new THREE.Vector3()), t = caja.getSize(new THREE.Vector3());
  // Con una planta casi cuadrada y una pantalla estrecha, el límite es siempre el ancho: al
  // encuadrarla entera sobraban tres cuartos de alto y la oficina quedaba diminuta. En vertical
  // se ensancha el campo de visión, que acerca la cámara sin recortar nada.
  const vertical = camera.aspect < 1;
  camera.fov = vertical ? 78 : 38;
  camera.updateProjectionMatrix();
  const dir = vertical ? new THREE.Vector3(0.3, 0.68, 0.67).normalize() : new THREE.Vector3(0.18, 0.72, 0.67).normalize();
  const tgt = new THREE.Vector3(c.x, 1, c.z);
  // solo las cuatro esquinas del suelo: incluir la altura de los muros alejaba de más,
  // porque en picado su parte alta se proyecta muy por encima de la planta
  const esquinas = [];
  for (const sx of [-1, 1]) for (const sz of [-1, 1])
    esquinas.push(new THREE.Vector3(c.x + sx * t.x / 2, 0, c.z + sz * t.z / 2));

  const prueba = camera.clone();
  let d = Math.max(t.x, t.z);
  for (let i = 0; i < 24; i++){
    prueba.position.copy(tgt).addScaledVector(dir, d);
    prueba.lookAt(tgt);
    prueba.updateMatrixWorld(true);
    prueba.updateProjectionMatrix();
    let mx = 0, my = 0;
    for (const e of esquinas){
      const p = e.clone().project(prueba);
      mx = Math.max(mx, Math.abs(p.x)); my = Math.max(my, Math.abs(p.y));
    }
    const max = Math.max(mx, my);
    if (Math.abs(max - MARGEN) < 0.02) break;
    d *= max / MARGEN;
  }
  vistaGeneral.tgt.copy(tgt);
  vistaGeneral.pos.copy(tgt).addScaledVector(dir, d);
  // sin esto OrbitControls recorta la distancia y la planta se sale por los lados
  controls.maxDistance = Math.max(46, d + 4);
}
function vuela(sala){
  if (!sala){ vuelo = { pos:vistaGeneral.pos.clone(), tgt:vistaGeneral.tgt.clone() }; return; }
  const c = sala.getWorldPosition(new THREE.Vector3());
  const frente = new THREE.Vector3(0, 0, 1).applyQuaternion(sala.quaternion).multiplyScalar(sala.userData.D * 0.85 + 5);
  vuelo = { tgt:new THREE.Vector3(c.x, 1.2, c.z), pos:new THREE.Vector3(c.x + frente.x, 8.5, c.z + frente.z) };
}

renderer.domElement.addEventListener('pointerdown', e => { bajada = [e.clientX, e.clientY]; $('#ayuda').classList.add('off'); });

  else { abre(null); destino = new THREE.Vector3(hit.point.x, 0, hit.point.z); }

  for (const g of puestos.values()) g.userData.baliza.userData.luz.visible = false;
  scene.traverse(o => { if (o.isMesh) o.castShadow = false; });
  renderer.shadowMap.needsUpdate = true;
  console.info('oficina: modo ligero (sombras y luces de robot fuera)');
}

function bucle(){
  reloj.update();
  const t = reloj.getElapsed(), dt = Math.min(reloj.getDelta(), 0.05);
  fps += (1 / Math.max(dt, 1e-3) - fps) * 0.05;
  if (!degradado && t > 6 && fps < 30) degrada();

  let mx = 0, mz = 0;
  const dx = +(teclas.has('d') || teclas.has('arrowright')) - +(teclas.has('a') || teclas.has('arrowleft'));
  const dz = +(teclas.has('w') || teclas.has('arrowup')) - +(teclas.has('s') || teclas.has('arrowdown'));
  if (dx || dz){
    destino = null; vuelo = null;
    frente.subVectors(controls.target, camera.position).setY(0).normalize();
    mx = frente.x * dz - frente.z * dx;
    mz = frente.z * dz + frente.x * dx;
  } else if (destino){
    const vx = destino.x - yo.position.x, vz = destino.z - yo.position.z, dist = Math.hypot(vx, vz);
    if (dist < 0.15) destino = null; else { mx = vx / dist; mz = vz / dist; }
  }
  let andando = false;
  if (mx || mz){
    const len = Math.hypot(mx, mz);
    const antesX = yo.position.x, antesZ = yo.position.z;
    mueve(mx / len * VEL * dt, mz / len * VEL * dt);
    andando = Math.hypot(yo.position.x - antesX, yo.position.z - antesZ) > 1e-4;
    if (!andando) destino = null;
    else yo.rotation.y = Math.atan2(mx, mz);
  }
  if (!quieto) animaRobot(yoRobot, t, dt, { s: andando ? 2.2 : 1, amp: andando ? 0.22 : 0.07 });

  if (vuelo){
    const k = 1 - Math.pow(0.002, dt);
    camera.position.lerp(vuelo.pos, k);
    controls.target.lerp(vuelo.tgt, k);
    if (camera.position.distanceTo(vuelo.pos) < 0.08) vuelo = null;
  } else if (andando || destino){
    tmp.set(yo.position.x, 1, yo.position.z).sub(controls.target).multiplyScalar(0.12);
    controls.target.add(tmp); camera.position.add(tmp);
  }
  controls.update();

  const z = [...salas.values()].find(s => { const o = s.userData.zona; return yo.position.x > o.x0 && yo.position.x < o.x1 && yo.position.z > o.z0 && yo.position.z < o.z1; });
  const nombre = z ? z.userData.cfg.nombre : 'Planta';
  if (nombre !== zonaActual){ zonaActual = nombre; $('#zona').innerHTML = z ? `<b>${esc(nombre)}</b>` : 'Planta'; }

  if (!quieto){
    // solo animan los que trabajan; el resto apenas flota
    for (const g of puestos.values()){
      const u = g.userData;
      if (u.animo === 'hablando' && t > u.animoHasta) animo(g, null);
      if (u.animo) animaRobot(u.robot, t, dt, { s: u.animo === 'pensando' ? 1.7 : 2.4, amp:0.16, habla:u.animo === 'hablando', mira:yo.position });
      else if (u.estado?.situacion === 'trabajando') animaRobot(u.robot, t, dt, { s:3.2, amp:0.26, mira:yo.position });
      else reposa(u.robot, t);
      if (u.barras.visible) for (const b of u.barras.children){
        const h = 0.3 + (Math.sin(t * 1.6 + b.userData.k) * 0.5 + 0.5) * 0.7;
        b.scale.y = h; b.position.y = h * 0.25;
      }
    }
    for (const h of plantas) h.rotation.z = Math.sin(t * 0.8 + h.position.x) * 0.04;
  }

  renderer.render(scene, camera);
  etiquetas.render(scene, camera);
}

/* ── datos: el JSON del brief ───────────────────────── */
let sinConexion = false, ultimoJson = null; // el último JSON válido, para repintar sin volver a pedirlo

// función pública del brief: recibe el objeto y actualiza toda la escena
function actualiza(datos){
  const est = normaliza(datos);
  for (const p of SIMBAI.puestos) est[p] = deAgente(agentesReales.get(p));
  for (const [id, e] of Object.entries(est)){
    const g = puestos.get(id);
    if (g && !g.userData.animo) aplica(id, e);
    else if (g) g.userData.estado = e; // conversando: se guarda y se aplica al terminar
  }
  for (const [id, s] of salas){
    const cfg = s.userData.cfg;
    const suyos = cfg.puestos.map(p => est[p]?.situacion || 'libre');
    const trabajando = suyos.filter(x => x === 'trabajando').length;
    const parados = suyos.filter(x => x === 'parado').length;
    s.userData.div.className = 'placa card' + (trabajando ? ' activa' : parados === suyos.length ? ' parada' : '');
    // data-ini: en vertical el CSS muestra solo esta inicial dentro de una pastilla redonda
    s.userData.div.dataset.ini = cfg.nombre[0];
    s.userData.div.innerHTML = `<b>${esc(cfg.nombre)}</b> <span>· ${trabajando ? `${trabajando} trabajando` : parados ? 'parado' : 'libre'}</span><i></i>`;
  }
  if (abierto) pintaSala(abierto);
  const total = Object.values(est).filter(e => e.situacion === 'trabajando').length;
  const clave = sinConexion ? 'libre' : total ? 'trabajando' : 'libre';
  $('#estado').style.setProperty('--dot', SIT[clave].css);
  $('#estado span').textContent = sinConexion ? 'sin conexión con los agentes'
    : total ? `${total} ${total === 1 ? 'agente trabajando' : 'agentes trabajando'} de ${Object.keys(est).length}` : `${Object.keys(est).length} agentes libres`;
}
if (Q.has('test')) window.__actualiza = actualiza;

async function sondea(){
  if (!CFG.estado) return;
  try {
    const r = await fetch(CFG.estado, { cache:'no-store' });
    if (!r.ok) throw new Error(String(r.status));
    const d = await r.json();
    sinConexion = false; ultimoJson = d;
    $('#aviso').textContent = '';
    actualiza(d);
  } catch {
    // el endpoint no responde: la oficina sigue en pie, todos libres
    if (!sinConexion){
      sinConexion = true;
      $('#aviso').textContent = 'Sin conexión con el panel de estado: se muestran todos libres';
      actualiza(null);
    }
  }
}

async function principal(){
  suelo = construye();
  const rec = recepcion.getWorldPosition(new THREE.Vector3());
  yo.position.set(rec.x + 5, 0, rec.z);
  yo.rotation.y = -Math.PI / 2;
  encuadraGeneral(); // ya con el edificio en la escena: la caja real manda
  camera.position.copy(vistaGeneral.pos); controls.target.copy(vistaGeneral.tgt); controls.update();

  // la oficina se pinta antes de pedir nada: ningún fallo de red puede dejarla cargando
  actualiza(CFG.estado ? null : EJEMPLO);
  cargaModelos().catch(() => {});
  cargaAgentes().then(() => actualiza(ultimoJson)).catch(() => {});
  if (CFG.estado){ sondea(); setInterval(sondea, 5000); }
  setInterval(() => { cargaModelos().catch(() => {}); cargaAgentes().then(() => actualiza(ultimoJson)).catch(() => {}); }, 30_000);

  if (Q.has('test')) window.__oficina = {
    yo, puestos, salas, cam:camera.position, camara:camera, target:controls.target, maxDistance:controls.maxDistance, V3:THREE.Vector3,
    recepcion: rec,
    mercados: salas.get('mercados').getWorldPosition(new THREE.Vector3()),
    estado: id => puestos.get(id)?.userData.estado,
    fps: () => Math.round(fps), sombras: () => renderer.shadowMap.enabled,
  };

  $('#ayuda span').textContent = tactil
    ? 'toca un despacho para verlo · toca el suelo para moverte'
    : 'clic en un despacho para verlo · WASD para moverte · arrastra para orbitar · rueda para zoom';
  $('#msg').remove();
  renderer.setAnimationLoop(bucle);
}
if (renderer) principal();
</script>
